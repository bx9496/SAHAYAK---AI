<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>AI Manager</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>
    <body>
        <header><a class="logo" href="/">SAHAYAK <b>AI</b></a>
            <nav><a href="/">Home</a><a href="/eligibility">Eligibility</a>
                <a href="/document-engine">OCR Engine</a>
            </nav>
        </header>
        <main class="wrap page">
            <p class="tag">FEATURE 01</p>
            <h1>AI Government Life Manager</h1>
            <div class="two">
                <section class="panel">
                    <div id="chat" class="chat">
                        <div class="bubble bot">Hello! Tell me what government task, document or scheme you need help with.</div>
                    </div>
                    <div class="send">
                        <input id="question" placeholder="Example: What documents do I need for a scholarship?">
                        <button class="btn blue" onclick="askAI()">Send</button>
                    </div>
                </section>
                <aside class="panel">
                    <h3>Your Government Profile</h3>
                    <div id="profileSummary">Loading profile...</div>
                    <hr><h3>Personal Reminder</h3><input id="reminderTask" placeholder="Task">
                    <input id="reminderDate" type="date">
                    <button class="btn yellow" onclick="addReminder()">Save Reminder</button>
                    <div id="reminders"></div>
                </aside>
            </div>
        </main>
        <footer>SAHAYAK AI</footer>
        <script src="/static/script.js"></script>
    </body>
    </html>
