<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCR + ReCorrect</title><link rel="stylesheet" href="/static/style.css"><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script></head><body>
<header><a class="logo" href="/">SAHAYAK <b>AI</b></a><nav><a href="/">Home</a><a href="/ai-manager">AI Manager</a><a href="/eligibility">Eligibility</a><a href="/account">Login/KYC</a></nav><button id="themeBtn" class="theme" onclick="toggleTheme()">🌙 Dark</button></header>
<main class="wrap page"><p class="tag">FEATURE 03</p><h1>OCR + ReCorrect Engine</h1><p class="muted">Scan English, Hindi or Odia documents, translate them, correct extracted data and save scans to your account.</p>
<section class="panel"><div class="lang-row"><div><label>Document language</label><select id="ocrSourceLanguage"><option value="eng">English</option><option value="hin">Hindi</option><option value="ori">Odia</option></select></div><div><label>Translate to</label><select id="ocrLanguage"><option>English</option><option>Hindi</option><option>Odia</option></select></div><div><label>Image</label><input id="file" type="file" accept="image/*"></div><button class="btn blue" onclick="runOCREnhanced()">Scan</button></div><p id="ocrStatus" class="muted"></p></section>
<div class="two"><section class="panel"><h3>Extracted Text</h3><textarea id="ocrText" rows="13"></textarea><button class="btn blue" onclick="translateOCR()">Translate</button><p id="translationStatus" class="muted"></p><label>Translated Text</label><textarea id="translatedText" rows="11"></textarea><button class="btn yellow" onclick="saveScanData()">Save Scan</button></section>
<section class="panel"><h3>ReCorrect</h3><div class="formgrid"><div><label>Name</label><input id="name"><label>Guardian</label><input id="guardian"><label>Age</label><input id="age" type="number"><label>Category</label><select id="category"><option value="">Select</option><option>SC</option><option>ST</option><option>OBC</option><option>EWS</option><option>GENERAL</option></select></div><div><label>Income ₹</label><input id="income" type="number"><label>State</label><input id="state"><label>District</label><input id="district"><label>Education</label><select id="education"><option value="">Select</option><option>School Student</option><option>College Student</option><option>Graduate</option></select></div></div><button class="btn yellow" onclick="recorrect()">Check Data</button> <button class="btn blue" onclick="saveProfile()">Save Profile</button><div id="quality"></div><hr><h3>Saved Scans</h3><div id="scanHistory" class="scan-history">Loading...</div></section></div></main><footer>SAHAYAK AI</footer><script src="/static/script.js"></script></body></html>
